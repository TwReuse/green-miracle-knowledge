site_name: 綠色奇蹟服務傳承與永續共創
site_description: 記錄綠色奇蹟的服務歷程、年度變化、資源再生、公益協作與未來共創，提供大眾閱讀與引用
site_url: https://docs.reuse.org.tw/
site_author: 社團法人綠色奇蹟公益服務網協會
copyright: © 社團法人綠色奇蹟公益服務網協會｜本網站保存服務傳承與年度觀察，當期服務以官網公告為準。
docs_dir: public-site
strict: true
theme:
  name: mkdocs
  custom_dir: public-site/overrides
  locale: zh_TW
  logo: assets/images/reuse-logo.png
  favicon: assets/images/reuse-logo.png
  nav_style: primary
  highlightjs: true
  user_color_mode_toggle: false
plugins:
  - search:
      lang: zh
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
extra_css:
  - assets/stylesheets/green-miracle.css
nav:
  - 永續共創: index.md
  - 服務演進:
      - 服務歷程: public/our-story.md
      - 歷年記事: public/annual-chronicle.md
      - 簡報大綱: public/presentation-outline-2026.md
  - 再生服務:
      - 電腦旅程: public/computer-journey.md
      - 數位安全: public/digital-safety.md
  - 資料引用:
      - 年度觀察: public/annual-2026.md
      - 事實資料: public/factsheet.md
      - 常見問題: public/faq.md
      - 引用說明: public/how-to-cite.md
