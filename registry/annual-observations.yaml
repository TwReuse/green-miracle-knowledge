site_name: 綠色奇蹟服務傳承與永續共創
official_site_menu_label: 永續共創
owner: Chinwen
chronicle:
  public_path: public-site/public/annual-chronicle.md
  update_frequency: annual
  purpose: 以年度或階段摘要保存重要記事、當下困難、當時想法與採取做法，呈現服務如何演進。
  required_fields: [年度, 重要記事或新聞摘要, 當下困難, 當時想法, 採取做法]
  update_rule: 每完成一篇年度觀察，同步在歷年記事新增或修訂一張年度卡片；事件細節與價格計算仍保留在各年度觀察。
update_policy:
  formal_cycle: annual
  target_publish_month: 4
  midyear_supplement_triggers:
    - 作業系統、安全支援、授權或法規重大改變
    - 單台整備成本較核定基準變動超過 10%
    - 合規設備供應或交付等待時間出現重大變化
  required_sections:
    - 年度發生的變化
    - 對服務與使用者的影響
    - 綠色奇蹟的回應
    - 可驗證結果
    - 未解問題與下一年方向
    - 引用方式與資料限制
