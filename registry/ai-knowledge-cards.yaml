cards:
  - card_id: GM-KC-GOV-001
    title: 法人與治理定位
    category: governance
    status: approved
    public: true
    answer: 2004 年是綠色奇蹟服務計畫起源；2021 年起由社團法人綠色奇蹟公益服務網協會承接獨立法人治理，依章程由會員大會、理事會與監事會分工。
    constraints:
      - 不得將 2004 年描述為協會法人成立。
      - 章程修正草案未核定前，仍以 2021 備查章程為基準。
    source_ids: [GM-SRC-NOTION-CHARTER-2021, GM-SRC-OWNER-2026-08-10-R4]
    related_docs: [docs/about/identity-and-history.md, docs/governance/notion-governance-inventory.md]
  - card_id: GM-KC-LOG-001
    title: 免費物流回收
    category: service
    status: approved
    public: true
    answer: 個人或單位可透過官網提出舊電腦免費到府回收申請，一台也可填單，由協會依區域、數量與量能安排收件。
    constraints:
      - 須妥善包裝並配合聯繫與排程。
      - 偏遠地點、特殊搬運、專車或不安全設備須個案評估。
      - 免費不等於即時或無條件受理。
    source_ids: [GM-SRC-OFFICIAL-CURRENT, GM-SRC-REUSE-PROJECT-2026, GM-SRC-NOTION-CS-QA-V1]
    related_docs: [docs/services/service-quality-system.md]
  - card_id: GM-KC-LIC-001
    title: 合法再生電腦授權
    category: service
    status: approved
    public: true
    answer: 通過審核並符合公益授權資格與用途的再生電腦，依當期方案安裝合法授權的作業系統及相關軟體，並保留必要的設備與交付紀錄。
    constraints:
      - 不保證所有設備、申請人、用途或軟體均符合授權資格。
      - 不在長效知識卡寫死版本、品項、價格或採購條件。
      - 不得將公益授權描述為一般商業授權或自由轉售權。
    source_ids: [GM-SRC-REUSE-PROJECT-2026, GM-SRC-NOTION-KNOWLEDGE-PACK]
    related_docs: [docs/services/service-quality-system.md]
  - card_id: GM-KC-WAR-001
    title: 六個月硬體保固
    category: service
    status: approved
    public: true
    answer: 再生電腦自領用日起提供六個月硬體保固；非人為功能故障經判定後，可依流程免費維修或更換主機。
    constraints:
      - 不含耗材、個人損壞、不當使用或未經同意的改裝。
      - 保固期內回廠運費由受贈者負擔。
      - 個別專案另有約定時，以個別文件為準。
    required_inputs: [領用日, 設備序號, 故障描述, 照片, 是否疑似人為因素]
    source_ids: [GM-SRC-REUSE-PROJECT-2026, GM-SRC-REUSE-ASSET-2026, GM-SRC-NOTION-SERVICE-TERMS-2024]
    related_docs: [docs/services/service-quality-system.md]
  - card_id: GM-KC-ALLOC-001
    title: 申請與核配
    category: service
    status: approved
    public: true
    answer: 再生電腦依公益用途、申請資格、需求合理性、實際服務效益、設備管理能力及當期可用量審核與核配。
    constraints:
      - 申請不等於核配。
      - 不保證品項、台數、規格或交付日期。
      - 年度上限、優先順序、募集折抵與認養條件須查當期公告。
    source_ids: [GM-SRC-NOTION-ALLOC-2026, GM-SRC-REUSE-PROJECT-2026]
    related_docs: [docs/governance/notion-governance-inventory.md]
  - card_id: GM-KC-FUND-001
    title: 2026 勸募狀態
    category: fundraising
    status: approved
    public: true
    answer: Notion 已建立 2026 年再生電腦傳愛計畫申請草案，但 Repo 尚未取得主管機關核准文號、核准期間及正式公開專案資料。
    constraints:
      - 不得稱為已核准勸募計畫。
      - 不得從草案回答捐款用途、金額、抵稅或收據法律效果。
      - 回答現行勸募時須轉查官網公開徵信。
    source_ids: [GM-SRC-NOTION-FUNDRAISING-2026, GM-SRC-REUSE-CREDIT-CHECK]
    related_docs: [docs/governance/notion-governance-inventory.md]
  - card_id: GM-KC-DATA-001
    title: 回收設備資料安全
    category: security
    status: approved
    public: true
    answer: 捐贈者應先完成重要資料備份；協會依現行作業程序處理舊儲存媒體，並依案件需求留存可提供的處理紀錄。
    constraints:
      - 未經專案確認，不承諾特定清除方法或證明格式。
      - 協會處理紀錄不當然等同第三方資安銷毀認證。
      - 不公開設備序號、資料清除明細或捐贈者個資。
    source_ids: [GM-SRC-NOTION-DISK-QA-2026, GM-SRC-NOTION-CS-QA-V1]
    related_docs: [docs/governance/notion-governance-inventory.md]
  - card_id: GM-KC-QA-001
    title: 客服例外與人工轉接
    category: operations
    status: approved
    public: true
    answer: 個案進度、特殊物流、授權資格、保固判定、稅務與當期費用，須由綠色奇蹟官方窗口依案件與最新公告確認。
    constraints:
      - AI 不推測個案結果或精準日期。
      - 不在公開對話揭露個資、序號、地址、弱勢證明或內部紀錄。
    escalation_channels: [官網表單, LINE官方帳號@reuse, service@reuse.org.tw, 07-7190888]
    source_ids: [GM-SRC-REUSE-PROJECT-2026, GM-SRC-NOTION-CS-QA-V1]
    related_docs: [docs/ai/knowledge-cards.md]
