schema_version: "1.0"
registry_id: GM-HISTORY-EVENTS
status: review
owner: Chinwen
last_reviewed: 2026-08-11
evidence_levels:
  A: 法人、政府或正式核定文件
  B: 事件同期的合作方或機構公開資料
  C: 協會官方歷史、成果報告或公開作業資料
  D: Notion、訪談筆記或待查證敘事
  O: Governance Owner 核定，可公開敘述；原始限制文件另行保存
