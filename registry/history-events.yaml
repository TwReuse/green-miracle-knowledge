    verification_status: owner-confirmed
    public_readiness: review
    participants:
      project_executor: 資策會
      regional_subcontractor: 屏東縣電腦商業同業公會
      regional_scope: 屏東地區再生電腦捐贈與安裝
      website_service_provider: 矽聯科技
    corporate_governance_body: 矽聯科技股份有限公司年度董事會
    name_status: 綠色奇蹟為網站與服務名稱
    service_maturity: 服務計畫成立並開始投入人力，後續能力逐年擴充
    governance_note: 2004 可稱綠色奇蹟服務計畫成立或服務誕生，但不是協會法人成立。
  - id: GM-HIST-2005-MAR
    date_start: "2005"
    date_precision: year
    title: 取得微軟 MAR 資格
    source_ids: [GM-SRC-OWNER-2026-08-10-R4, GM-SRC-OFFICIAL-HISTORY]
    evidence_level: O
    verification_status: owner-confirmed-operating-fact
    public_readiness: review
    evidence_policy: 透過微軟線上平台申請，依使用規範負擔追蹤責任，並線上下單取得再生電腦公益授權；沒有實體合約。
  - id: GM-HIST-2005-RECOVERY-BOTTLENECK
    date_start: "2005"
    date_precision: year
    title: 申請增加後出現回收量與來料品質瓶頸
    source_ids: [GM-SRC-OWNER-HISTORY-POLICY-2026-08-11]
    evidence_level: O
    verification_status: owner-confirmed
    public_readiness: review
    challenge: 申請數量高於往年，但合作回收商有未達數量不派車的門檻；回收設備亦有缺件與品質問題，使整修產出無法同步增加。
    policy_effect: 促成夥伴決議試作由服務端支援免費物流到府回收。
  - id: GM-HIST-2006-FREE-PICKUP-PILOT
    date_start: "2006"
    date_precision: year
    title: 試作免費物流到府回收與一台也回收
    source_ids: [GM-SRC-OWNER-HISTORY-POLICY-2026-08-11, GM-SRC-OWNER-2026-08-10-R4]
    evidence_level: O
    verification_status: owner-confirmed
    public_readiness: review
    service_positioning: 將綠色奇蹟定位為面向消費者的電腦回收服務，一台也可提出到府回收申請。
    policy_effect: 以線上填單、免費物流與跨區排程，降低回收量不足時無法全省派車的困境。
  - id: GM-HIST-2008-QUALITY-WARRANTY
    date_start: "2008"
    date_precision: year
    title: 提高檢測規格並建立六個月免費保固
    source_ids: [GM-SRC-OWNER-HISTORY-POLICY-2026-08-11]
    evidence_level: O
    verification_status: owner-confirmed
    public_readiness: review
    context: 城市電子垃圾流向偏鄉的新聞事件引發社會討論，也凸顯受贈者對再生設備品質的期待落差。
    policy_effect: 要求整修夥伴提高檢測品質與交付規格，綠色奇蹟出廠的再生電腦提供六個月免費保固。
  - id: GM-HIST-2006-2008-ONLINE
    date_start: "2006"
    date_end: "2008"
    date_precision: year-range
    title: 線上回收、申請與論壇功能逐步完成
    source_ids: [GM-SRC-OWNER-2026-08-10-R4, GM-SRC-OFFICIAL-HISTORY, GM-SRC-FCU-2008]
    evidence_level: O
    verification_status: owner-confirmed
    public_readiness: review
    milestones:
      "2006": 線上填單物流回收
      "2007": 除環保署專案學校函文造冊外，開始接受再生電腦線上申請
      "2008": 完成論壇相關系統，以當時熱門社群資訊宣傳回收、擴大設備來源
