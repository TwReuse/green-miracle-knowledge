  - id: GM-HIST-2021-DATA-STORAGE-POLICY
    date_start: "2021"
    date_precision: year
    title: 加強回收電腦個資保護與儲存裝置分流
    source_ids: [GM-SRC-OWNER-HISTORY-POLICY-2026-08-11]
    evidence_level: O
    verification_status: owner-confirmed
    public_readiness: review
    policy:
      regenerated_computer_storage: 再生電腦一律改用新品 SSD。
      reusable_old_drives: 舊硬碟依當時作業完成低階格式化，品質尚可者轉作儲存碟或維修備品。
      noncompliant_old_drives: 不符合再利用規範者一律破壞、造冊並報廢。
    evidence_policy: 本事件記錄 2021 年歷史政策，不取代現行資料處理 SOP，也不得宣稱等同第三方資安銷毀認證。
