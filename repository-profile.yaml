repository_name: green-miracle-knowledge
repository_type: knowledge-site
repository_type_label: 知識類別網站
visibility: public
remote_organization: TwReuse
remote_url: https://github.com/TwReuse/green-miracle-knowledge
hosting_model: 矽聯科技技術代管，綠色奇蹟保有法人內容權責
legal_content_owner: 綠色奇蹟公益服務網協會
technical_custodian: 矽聯科技股份有限公司
repository_administrator: Chinwen
github_handle: SLchinwen
description: 綠色奇蹟服務傳承與永續共創網站、公開知識、教育訓練與內容 SSOT
governance_operating_model:
  mode: single-person
  label: 單人作業治理
  operator: Chinwen
  control: 由同一人統籌編修、審查、核定與發布，並以來源、版本、差異檢查、自動驗證、提交紀錄及核定證據維持可追溯性。
  exceptions: 法定決議、個資、募款、財務及第三方權利仍依章程、法令或外部授權辦理。
public_site_config: mkdocs.yml
public_site_root: public-site
knowledge_preview_config: mkdocs.knowledge.yml
knowledge_root: knowledge-base
workbench_root: workbench
machine_readable_root: registry
directory_boundary: 所有目錄可在公開 Repo 查閱；只有 public-site 由正式網站發布，這是呈現模式而非機密等級。
default_branch: main
branch_protection:
  require_pull_request: true
  required_approvals: 1
  require_code_owner_review_for_high_risk_paths: true
  require_status_checks:
    - docs-check
  prohibit_force_push: true
  prohibit_deletion: true
permissions:
  administrators: Chinwen
  maintainers: Chinwen
  technical_recovery: TwReuse 組織管理者僅處理帳號與 Repo 存取復原，不取得協會內容核定權。
  reviewers: Chinwen 依內容風險邀請理監事、方案人員或外部權利人提供意見。
  contributors: 工作人員、志工與合作夥伴
  public: read-only
release_model:
  documentation_site: GitHub Pages 或協會控制的公開網域
  versioning: 每次核定內容以 tag 或 release 保留版本
  downstream_traceability: 官網、簡報、行銷與 AI 保留知識 ID 及版本
decisions_pending:
  - GitHub Pages 的正式網域與 DNS 管理人
