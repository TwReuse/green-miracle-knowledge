name: docs-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build public site
        run: python -m mkdocs build --strict --site-dir build/public
      - name: Build knowledge workbench
        run: python -m mkdocs build --strict -f mkdocs.knowledge.yml --site-dir build/knowledge

